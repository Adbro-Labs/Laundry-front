<div class="page">
  <h2>{{ id ? 'Edit' : 'Create' }} Inventory Item</h2>
  <form [formGroup]="form" (ngSubmit)="save()">
    <mat-form-field appearance="outline" class="full">
      <mat-label>Item Name</mat-label>
      <input matInput formControlName="itemName" />
      <mat-error *ngIf="form.controls.itemName.invalid">Item name is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Item Code</mat-label>
      <input matInput formControlName="itemCode" />
      <mat-error *ngIf="form.controls.itemCode.invalid">Item code is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Unit</mat-label>
      <mat-select formControlName="unit">
        <mat-option *ngFor="let u of units" [value]="u">{{ u }}</mat-option>
      </mat-select>
      <mat-error *ngIf="form.controls.unit.invalid">Unit is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Minimum Stock Level</mat-label>
      <input type="number" matInput formControlName="minimumStockLevel" />
      <mat-error *ngIf="form.controls.minimumStockLevel.invalid">Minimum stock must be >= 0</mat-error>
    </mat-form-field>

    <div>
      <button mat-raised-button color="primary" [disabled]="loading">Save</button>
    </div>
  </form>
</div>
