<div class="page">
  <div
    class="page-header"
    style="display: flex; justify-content: space-between; align-items: center"
  >
    <h2>Suppliers</h2>
    <button mat-raised-button color="primary" (click)="add()">
      Add Supplier
    </button>
  </div>

  <div class="table-wrapper">
    <div class="table">
      <table>
        <thead>
          <tr>
            <th>Supplier</th>
            <th>Contact</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let supplier of dataSource.data">
            <td>{{ supplier.supplierName }}</td>
            <td>{{ supplier.contactPerson }}</td>
            <td>{{ supplier.phone }}</td>
            <td>{{ supplier.email }}</td>
            <td>{{ supplier.isActive ? 'Active' : 'Disabled' }}</td>
            <td>
              <button mat-button (click)="edit(supplier)">Edit</button>
              <button mat-button color="warn" (click)="disable(supplier._id)">
                Disable
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
