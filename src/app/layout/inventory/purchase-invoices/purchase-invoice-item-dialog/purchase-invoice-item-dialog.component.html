<h2 mat-dialog-title>{{ isEditMode ? 'Edit Item' : 'Add Item' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Item</mat-label>
      <mat-select formControlName="itemId">
        <mat-option *ngFor="let item of allItems" [value]="item._id">
          {{ item.itemName }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="form.get('itemId')?.invalid">Item is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Quantity</mat-label>
      <input matInput type="number" formControlName="quantity" min="1" />
      <mat-error *ngIf="form.get('quantity')?.invalid">Quantity must be greater than 0</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Unit Cost</mat-label>
      <input matInput type="number" formControlName="unitCost" min="0.01" step="0.01" />
      <mat-error *ngIf="form.get('unitCost')?.invalid">Unit cost must be greater than 0</mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="!form.valid">
    {{ isEditMode ? 'Update' : 'Add' }}
  </button>
</mat-dialog-actions>
