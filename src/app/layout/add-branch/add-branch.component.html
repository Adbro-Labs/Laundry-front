<div class="container">
  <p *ngIf="errormessage" style="color: red; text-align: center">
    {{ errormessage }}
  </p>
  <form class="form" [formGroup]="customerForm" (ngSubmit)="saveCustomer()">
    <mat-form-field>
      <input
        formControlName="branchName"
        autocomplete="off"
        matInput
        type="text"
        placeholder="Branch Name"
      />
    </mat-form-field>
    <mat-form-field *ngIf="showStoreSelector && stores.length > 0">
      <mat-select formControlName="storeCode" placeholder="Store">
        <mat-option
          [value]="item.storeCode"
          *ngFor="let item of stores; index as i"
        >
          {{ item.storeName }}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <div
      *ngIf="!showStoreSelector && customerForm.get('storeCode')?.value"
      class="helper-text"
    >
      Store: {{ findStoreName(customerForm.get('storeCode')?.value) }}
    </div>
    <mat-form-field>
      <input
        formControlName="title"
        autocomplete="off"
        matInput
        type="text"
        placeholder="Invoice Title"
      />
    </mat-form-field>
    <mat-form-field>
      <input
        formControlName="subtitle1"
        autocomplete="off"
        matInput
        type="text"
        placeholder="Sub title 1"
      />
    </mat-form-field>
    <mat-form-field>
      <input
        formControlName="subtitle2"
        autocomplete="off"
        matInput
        type="text"
        placeholder="Sub title 2"
      />
    </mat-form-field>
    <mat-form-field>
      <input
        formControlName="imageUrl"
        autocomplete="off"
        matInput
        type="text"
        placeholder="Logo Url"
      />
    </mat-form-field>
    <mat-checkbox class="example-margin" formControlName="enableVat"
      >Enable VAT(5%)</mat-checkbox
    ><br />
    <mat-form-field>
      <input
        formControlName="taxNumber"
        autocomplete="off"
        matInput
        type="text"
        placeholder="Tax Registration Number"
      />
    </mat-form-field>
    <div class="btn-group">
      <button type="submit" mat-raised-button color="primary">Submit</button>
      <button
        (click)="closePopup()"
        type="reset"
        mat-raised-button
        color="accent"
      >
        Cancel
      </button>
    </div>
  </form>
</div>
